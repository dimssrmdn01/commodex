version: 2

models:
  - name: fct_harga_harian
    description: "Tabel agregasi Gold Layer untuk agregasi harga harian komoditas"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - asset_id
              - date_key
    columns:
      - name: asset_id
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
      - name: avg_price_idr
        tests:
          - not_null