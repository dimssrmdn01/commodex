version: 2

models:
  - name: fct_harga_harian
    description: "Tabel agregasi Gold Layer untuk agregasi harga harian komoditas"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_id
            - date_key
    columns:
      - name: asset_id
        data_tests:
          - not_null
      - name: date_key
        data_tests:
          - not_null
      - name: avg_price_idr
        data_tests:
          - not_null