<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Commodex</title>
  <desc id="d">Medallion pipeline for market prices: bronze, silver and gold layers connected by a flowing pulse of data.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#131a26"/>
    </linearGradient>

    <radialGradient id="bronze" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#E9AE74"/>
      <stop offset="1" stop-color="#85511f"/>
    </radialGradient>
    <radialGradient id="silver" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="1" stop-color="#8590a0"/>
    </radialGradient>
    <radialGradient id="gold" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE794"/>
      <stop offset="1" stop-color="#b3832a"/>
    </radialGradient>

    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>

  <!-- left: title block -->
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="68" font-weight="700" fill="#f2efe8" letter-spacing="-1.5">commodex</text>
    <text x="66" y="170" font-size="21" fill="#a3adbb">Medallion pipeline for market prices</text>
    <text x="66" y="206" font-size="15" fill="#6d7888">Python, PostgreSQL, dbt, GitHub Actions</text>
  </g>

  <!-- connecting line -->
  <line x1="640" y1="115" x2="1060" y2="115" stroke="#2b3547" stroke-width="2"/>

  <!-- halos (light up when the pulse arrives) -->
  <circle cx="640" cy="115" r="62" fill="#E9AE74" filter="url(#blur)" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
             keyTimes="0;0.02;0.25;1" values="0;0.55;0;0"/>
  </circle>
  <circle cx="850" cy="115" r="62" fill="#DDE3EC" filter="url(#blur)" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
             keyTimes="0;0.45;0.5;0.75;1" values="0;0;0.5;0;0"/>
  </circle>
  <circle cx="1060" cy="115" r="62" fill="#FFD866" filter="url(#blur)" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
             keyTimes="0;0.9;0.98;1" values="0;0;0.65;0"/>
  </circle>

  <!-- medallions -->
  <g>
    <circle cx="640" cy="115" r="56" fill="url(#bronze)"/>
    <circle cx="640" cy="115" r="46" fill="none" stroke="#3a210a" stroke-opacity="0.45" stroke-width="2"/>
    <text x="640" y="131" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#3a210a" fill-opacity="0.75">B</text>
  </g>
  <g>
    <circle cx="850" cy="115" r="56" fill="url(#silver)"/>
    <circle cx="850" cy="115" r="46" fill="none" stroke="#2a313c" stroke-opacity="0.4" stroke-width="2"/>
    <text x="850" y="131" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#2a313c" fill-opacity="0.7">S</text>
  </g>
  <g>
    <circle cx="1060" cy="115" r="56" fill="url(#gold)"/>
    <circle cx="1060" cy="115" r="46" fill="none" stroke="#4a3207" stroke-opacity="0.45" stroke-width="2"/>
    <text x="1060" y="131" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#4a3207" fill-opacity="0.75">G</text>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="208" font-size="17" font-weight="600" fill="#E9AE74">Bronze</text>
    <text x="640" y="230" font-size="14" fill="#7f8a9b">raw snapshots</text>

    <text x="850" y="208" font-size="17" font-weight="600" fill="#DDE3EC">Silver</text>
    <text x="850" y="230" font-size="14" fill="#7f8a9b">cleaned, deduplicated</text>

    <text x="1060" y="208" font-size="17" font-weight="600" fill="#FFD866">Gold</text>
    <text x="1060" y="230" font-size="14" fill="#7f8a9b">daily aggregates</text>
  </g>

  <!-- the single moving element: a pulse of data from bronze to gold -->
  <g>
    <circle r="9" fill="#FFF4C7" filter="url(#glow)" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M640,115 L1060,115"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.03;0.97;1" values="0;1;1;0"/>
    </circle>
    <circle r="4" fill="#ffffff" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M640,115 L1060,115"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.03;0.97;1" values="0;1;1;0"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
