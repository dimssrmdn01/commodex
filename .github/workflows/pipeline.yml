name: Commodex Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: komoditas_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d komoditas_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: admin
      DB_PASSWORD: adminpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: komoditas_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Pipeline (Bronze Layer)
        run: python src/ingest.py

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt run (Silver & Gold)
        working-directory: dbt
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .